name: CI
# Runs on pull requests and pushes. It does NOT deploy anything.
# To make it a gate: GitHub -> Settings -> Branches -> protect `main` ->
# require status check "test" and at least 1 review.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
